name: 发布

# 打一个 v* 的 tag 就出全平台安装包，并挂到 Release 上。
#
# 构建部分直接复用 ci.yml（workflow_call），保证发出去的包与 CI 上验证过的
# 是同一套流程产出的 —— 不会出现「CI 绿了但发布的包是另一套参数编的」。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag 名（如 v0.4.0）
        required: true

permissions:
  contents: write
  # 取 CI 那一轮的产物要读 Actions 的运行与产物记录。不加这条，gh run download
  # 会因为没有 actions: read 而 403。
  actions: read

jobs:
  # 这里不再重跑构建矩阵。
  #
  # 原来这个位置是 `uses: ./.github/workflows/ci.yml`，等于把整套构建与测试再走
  # 一遍 —— 而同一个提交在推分支时 ci.yml 已经编过、也跑过单元测试了。重来一遍
  # 既多花几分钟，也让发出去的二进制与 CI 里验证过的那份分属两次构建：有二进制
  # 缓存时一般相同，但没有任何东西保证它一定相同。
  #
  # 改成取那一轮的产物 —— 编一次、晋升发布。代价是打 tag 前必须先让 ci.yml 跑绿，
  # 而这本来就是应该的：找不到成功的 CI 运行就直接失败，不发没验证过的提交。
  publish:
    name: 汇总 CI 产物并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取 CI 已经构建好的产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                      --commit "$GITHUB_SHA" --status success --limit 1 \
                      --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "${RUN_ID}" ]; then
            echo "找不到 $GITHUB_SHA 的 ci.yml 成功运行 —— 先让它跑绿再打 tag。" >&2
            exit 1
          fi
          echo "取 CI 运行 ${RUN_ID} 的产物"

          mkdir -p artifacts
          # gh run download 按产物名建子目录，这里平铺成一层 —— 与原先
          # download-artifact(merge-multiple: true) 的结果一致，后面的清点与
          # 发布步骤因此不用改。
          gh run download "${RUN_ID}" --repo "$GITHUB_REPOSITORY" --dir _download
          find _download -type f -exec mv -t artifacts {} +
          rm -rf _download

      - name: 清点产物
        run: |
          set -euo pipefail
          find artifacts -type f -printf '%s\t%p\n' | sort -k2

          # 任何一个平台的包缺失都算发布失败 —— 宁可这一步红掉，
          # 也不要发出一个「看起来正常但少了某个平台」的 Release。
          for expected in \
            adisplay-windows-x64.zip \
            adisplay-windows-arm64.zip \
            adisplay-macos-universal.dmg \
            adisplay-android-tv.apk
          do
            if [ ! -f "artifacts/${expected}" ]; then
              echo "缺少产物：${expected}" >&2
              exit 1
            fi
          done
          echo "四个平台的产物都在。"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          append_body: true
          # 安装说明与「当前进度」从文件读，不写死在 workflow 里。
          #
          # 写死的后果是那段文字从 v0.1.0 一直沿用到 v0.3.2 都没变过 ——
          # 每次发版改了代码却忘了改它，Release 页上一直挂着「这是批次 0」。
          # 改一个普通文件比记得改 workflow 容易得多。
          body_path: docs/发布说明.md
